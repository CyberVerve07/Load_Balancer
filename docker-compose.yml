services:
  # ---------- Spring Boot backends ----------
  backend-1:
    build: ./backend-app
    container_name: backend-1
    environment:
      - SERVER_PORT=8080
      - APP_INSTANCE_ID=backend-1
    ports:
      - "8081:8080"
    restart: unless-stopped

  backend-2:
    build: ./backend-app
    container_name: backend-2
    environment:
      - SERVER_PORT=8080
      - APP_INSTANCE_ID=backend-2
    ports:
      - "8082:8080"
    restart: unless-stopped

  backend-3:
    build: ./backend-app
    container_name: backend-3
    environment:
      - SERVER_PORT=8080
      - APP_INSTANCE_ID=backend-3
    ports:
      - "8083:8080"
    restart: unless-stopped

  # ---------- NGINX load balancer ----------
  nginx-lb:
    image: nginx:alpine
    container_name: nginx-load-balancer
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    restart: unless-stopped
