worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ---------- upstream pool ----------
    upstream backend {
        # Round-robin is the default strategy.
        # Swap to 'least_conn;' or 'ip_hash;' if needed.
        server host.docker.internal:8081;
        server host.docker.internal:8082;
        server host.docker.internal:8083;
    }

    # ---------- reverse-proxy / load-balancer ----------
    server {
        listen 80;

        location / {
            proxy_pass         http://backend;
            proxy_http_version 1.1;

            # Forward original client info to backends
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Websocket support (safe to leave even if unused)
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }

        # Optional: basic health-check endpoint for the LB itself
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
